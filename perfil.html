<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Noesis — Perfil</title>
  <meta name="description" content="Tu perfil de tres lecturas Noesis." />
  <meta name="theme-color" content="#f3efe6" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <meta name="google-adsense-account" content="ca-pub-6310235398565319">
</head>
<body>
  <header class="site-header">
    <div class="inner">
      <a href="index.html" class="logo" aria-label="Noesis, inicio">
        <svg viewBox="0 0 48 48" width="28" height="28" aria-hidden="true">
          <circle cx="18" cy="20" r="12" fill="none" stroke="currentColor" stroke-width="1.5"/>
          <circle cx="30" cy="20" r="12" fill="none" stroke="currentColor" stroke-width="1.5"/>
          <circle cx="24" cy="30" r="12" fill="none" stroke="currentColor" stroke-width="1.5"/>
        </svg>
        Noesis
      </a>
      <a href="perfil.html" class="perfil-link">Perfil <strong data-perfil-count>0 / 3</strong></a>
    </div>
  </header>

  <main class="perfil-page">
    <p class="kicker">Tu retrato</p>
    <h1 id="perfil-title">Perfil</h1>
    <p class="muted" id="perfil-sub">Completa las tres lecturas para nombrar el patrón.</p>

    <div class="perfil-grid" id="perfil-grid"></div>

    <div class="ad-slot ad-banner" data-placeholder="true" aria-hidden="true">
      Espacio para anuncio
    </div>

    <div style="margin-top:2rem;display:flex;gap:0.75rem;flex-wrap:wrap">
      <a href="index.html" class="btn btn-primary">Volver al inicio</a>
      <button type="button" class="btn btn-ghost" id="btn-reset">Borrar perfil</button>
    </div>
  </main>

  <footer class="site-footer">
    <div class="inner">
      <p class="brand">Noesis</p>
      <p>Lecturas de estilo en tres ejes. No sustituyen evaluación clínica ni profesional.</p>
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      var name = NoesisStore.getName();
      var title = document.getElementById("perfil-title");
      if (name) title.textContent = name;

      var grid = document.getElementById("perfil-grid");
      var labels = {
        vinculo: { num: "01", name: "Vínculo", axis: "Cómo te unes", href: "test.html?slug=vinculo" },
        mente: { num: "02", name: "Mente", axis: "Cómo razonas", href: "test.html?slug=mente" },
        esfera: { num: "03", name: "Esfera", axis: "Cómo te leen", href: "test.html?slug=esfera" },
      };

      ["vinculo", "mente", "esfera"].forEach(function (slug) {
        var meta = labels[slug];
        var res = NoesisStore.getResult(slug);
        var art = document.createElement("article");
        art.className = "perfil-slot" + (res ? " done" : "");
        if (res) {
          art.innerHTML =
            '<p class="kicker">' + meta.num + " · " + meta.axis.toUpperCase() + "</p>" +
            '<p class="trait">' + res.traitName + "</p>" +
            '<p class="subtle" style="font-size:0.8rem;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:0.5rem">' + res.kicker + "</p>" +
            '<p class="muted" style="font-size:0.95rem;text-wrap:pretty">' + res.portrait + "</p>" +
            '<p style="margin-top:0.75rem"><a href="' + meta.href + '" style="font-size:0.85rem;color:var(--color-subtle)">Repetir lectura</a></p>';
        } else {
          art.innerHTML =
            '<p class="kicker">' + meta.num + " · " + meta.name + "</p>" +
            '<p class="pending">Aún sin lectura</p>' +
            '<p style="margin-top:0.75rem"><a href="' + meta.href + '" class="btn btn-outline" style="height:2.5rem;font-size:0.8rem">Iniciar</a></p>';
        }
        grid.appendChild(art);
      });

      var count = NoesisStore.completedCount();
      var sub = document.getElementById("perfil-sub");
      if (count === 3) {
        sub.textContent = "Las tres lecturas están hechas. Este es tu retrato de estilo.";
      } else if (count > 0) {
        sub.textContent = "Llevas " + count + " de 3. Sigue con el eje que falte.";
      }

      document.getElementById("btn-reset").addEventListener("click", function () {
        if (confirm("¿Borrar todo el perfil guardado en este dispositivo?")) {
          NoesisStore.clear();
          location.reload();
        }
      });
    });
  </script>
</body>
</html>
